<style>
*{box-sizing:border-box;}
body{
  margin:0;
  min-height:100vh;
  padding:30px;
  background:radial-gradient(circle at top,#182033,#070a12 60%,#020617);

  font-family:Orbitron,Arial,sans-serif;

<body>

<div class="temeria-public-root" style="position:relative;max-width:1200px;margin:auto;padding-top:30px;">
  <div class="temeria-card" style="
    position:relative;
    padding:30px;
    border-radius:26px;
    background:linear-gradient(135deg,#070a12,#7fffd9,#b06cff);
    color:#eafcff;
    max-width:650px;
    min-height:auto;
    width:92%;
    margin:auto;
    box-sizing:border-box;
    text-align:center;
    overflow:visible;
    box-shadow:0 0 40px rgba(0,0,0,.35),0 0 55px #b06cff;
    border:1px solid rgba(37,211,102,.22);box-shadow:0 0 40px rgba(37,211,102,.12),0 0 80px rgba(37,211,102,.08);
  ">
    

    <h1 style="font-size:34px;margin-bottom:20px;font-family:Orbitron,Arial,sans-serif;letter-spacing:2px;color:#00f6ff;text-shadow:0 0 20px #00f6ff,0 0 55px #b06cff;"></h1>

    <div style="font-size:22px;line-height:1.7;max-width:700px;margin:auto;color:#eafcff;font-style:normal;letter-spacing:normal;text-shadow:none;"></div>

    
    
    
    
    
<img
  src="https://AlexCaos75.github.io/Temeria-Media-Suite/assets/img/temeria-card.png"
  alt=""
  loading="lazy"
  decoding="async"
  style="
    width:100%;
    border-radius:22px;
    margin-top:25px;
    display:block;
    object-fit:cover;
    box-shadow:
      0 0 35px rgba(0,0,0,.35),
      0 0 35px #b06cff55;
  "
>
    
    
<div class="temeria-audio-box"
style="
  margin-top:25px;
  text-align:center;
">

  <div
    id="temeriaYT_vzxjnhp_wrap"
    style="
      position:fixed;
      left:-9999px;
      top:-9999px;
      width:1px;
      height:1px;
      overflow:hidden;
      opacity:0;
      pointer-events:none;
    "
  >

    <iframe
      id="temeriaYT_vzxjnhp"
      width="1"
      height="1"
      allow="autoplay; encrypted-media"
      referrerpolicy="strict-origin-when-cross-origin"
      frameborder="0"
      src="https://www.youtube.com/embed/1ZYbU82GVz4?enablejsapi=1&playsinline=1&loop=1&playlist=1ZYbU82GVz4&controls=0&modestbranding=1&rel=0&iv_load_policy=3&disablekb=1&fs=0&origin=http%3A%2F%2F127.0.0.1%3A5500">
    </iframe>

  </div>

  <div style="
    display:flex;
    gap:14px;
    justify-content:center;
    flex-wrap:wrap;
  ">

    <button
      type="button"
      onclick="TemeriaPublicPlayer.yt('temeriaYT_vzxjnhp','playVideo')"
      style="
        padding:15px 28px;
        border:none;
        cursor:pointer;
        border-radius:999px;
        background:linear-gradient(90deg,#00f6ff,#6cff9f);
        color:#020617;
        font-weight:800;
        font-size:17px;
        box-shadow:0 0 25px rgba(0,246,255,.28);
      "
    >
      ▶ PLAY
    </button>

    <button
      type="button"
      onclick="TemeriaPublicPlayer.yt('temeriaYT_vzxjnhp','pauseVideo')"
      style="
        padding:15px 28px;
        border:none;
        cursor:pointer;
        border-radius:999px;
        background:linear-gradient(90deg,#ff0033,#ff6b6b);
        color:white;
        font-weight:800;
        font-size:17px;
        box-shadow:0 0 25px rgba(255,0,80,.28);
      "
    >
      ⏹ STOP
    </button>

  </div>
</div>
    <div style="margin-top:25px;text-align:center;"><a href="https://wa.me/?text=https%3A%2F%2FAlexCaos75.github.io%2FTemeria-Media-Suite%2Fcards%2Ftemeria-card.html" target="_blank" style="display:inline-block;padding:16px 34px;border-radius:999px;background:linear-gradient(90deg,#25d366,#4bf58a);color:white;text-decoration:none;font-size:18px;font-weight:bold;box-shadow:0 0 35px rgba(37,211,102,.28);">💬 CONDIVIDI WHATSAPP</a></div>
  </div>
</div>

<script>

window.TemeriaPublicPlayer =
window.TemeriaPublicPlayer || {

  yt:function(id,action){

    var iframe =
      document.getElementById(id);

    if(!iframe ||
      !iframe.contentWindow)
      return;

    iframe.contentWindow.postMessage(
      JSON.stringify({
        event:"command",
        func:action,
        args:[]
      }),
      "*"
    );
  },

  mp3:function(id,action){

    var audio =
      document.getElementById(id);

    if(!audio)
      return;

    if(action === "play"){

      audio.play()
      .catch(function(){

        alert(
          "Premi PLAY di nuovo: il browser ha bloccato l'audio automatico."
        );

      });

    }

    if(action === "stop"){

      audio.pause();
      audio.currentTime = 0;

    }
  },

  copy:function(text){

    if(navigator.clipboard){

      navigator.clipboard.writeText(text);

    }
  }
};

</script>
</body>
