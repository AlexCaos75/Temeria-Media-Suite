  yt:function(id,action){

    var iframe =
      document.getElementById(id);

    if(!iframe ||
      !iframe.contentWindow)
      return;

    iframe.contentWindow.postMessage(
      JSON.stringify({
        event:"command",
        func:action,
        args:[]
      }),
      "*"
    );

        alert(

    if(action === "stop"){

      audio.pause();
      audio.currentTime = 0;

video:function(id,action){

  if(!video)

  if(action === "play"){

    video.play()

      alert(
        "Premi PLAY di nuovo: il browser ha bloccato l'autoplay."
      );

    });

  }

  if(action === "stop"){

    video.pause();
