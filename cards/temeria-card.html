

<!DOCTYPE html>

<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>temeria-card</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  padding:30px;
  background:#070a12;
  font-family:Orbitron,sans-serif;
}
</style>

</head>
<body>



<!-- WRAPPER -->

<div style="
position:relative;

max-width:1200px;

margin:auto;

padding-top:30px;
">

<!-- CARD -->

<div style="
position:relative;

padding:30px;

border-radius:26px;

background:
linear-gradient(
180deg,
#111827,
#0f172a
);

color:white;

max-width:900px;
width:92%;
margin:auto;
box-sizing:border-box;


text-align:center;

overflow:visible;

box-shadow:
0 0 40px rgba(0,0,0,.35);


">

<h1 style="
font-size:34px;
margin-bottom:20px;

font-family:
Orbitron,
sans-serif;

letter-spacing:2px;

text-shadow:
0 0 20px rgba(255,255,255,.15);
">

</h1>

<div style="
font-size:22px;
line-height:1.7;

max-width:700px;
margin:auto;

opacity:.96;
">
È una melodia notturna,<br>dedicata a chi ascolta dal balcone del cielo.<br>Dove TGIF incontra la luna,<br>nasce la notte dei sogni.
</div>


<img
src="https://i.postimg.cc/x8FrS9TM/Nyang-Piumy-(1).gif"
style="
width:100%;
border-radius:22px;
margin-top:25px;
box-shadow:0 0 35px rgba(0,0,0,.35);
display:block;
object-fit:cover;
"
>




<div style="
position:fixed;
left:-9999px;
top:-9999px;
width:1px;
height:1px;
overflow:visible;
opacity:0;
pointer-events:none;
">

<iframe
width="1"
height="1"
allow="autoplay"
frameborder="0"
src="
https://www.youtube.com/embed/pa4mTtiy4Lw?autoplay=1&mute=0&loop=1&playlist=pa4mTtiy4Lw
">
</iframe>

</div>







</div>

</div>



</body>
</html>
