<script>

window.TemeriaPublicPlayer =
window.TemeriaPublicPlayer || {

  yt:function(id,action){

    var iframe =
      document.getElementById(id);

    if(!iframe ||
      !iframe.contentWindow)
      return;

    iframe.contentWindow.postMessage(
      JSON.stringify({
        event:"command",
        func:action,
        args:[]
      }),
      "*"
    );
  },

  mp3:function(id,action){

    var audio =
      document.getElementById(id);

    if(!audio)
      return;

    if(action === "play"){

      audio.play()
      .catch(function(){

        alert(
          "Premi PLAY di nuovo: il browser ha bloccato l'audio automatico."
        );

      });

    }

    if(action === "stop"){

      audio.pause();
      audio.currentTime = 0;

    }
  },

video:function(id,action){

  var video =
    document.getElementById(id);

  if(!video)
    return;

  if(action === "play"){

    video.play()
    .catch(function(){

      alert(
        "Premi PLAY di nuovo: il browser ha bloccato l'autoplay."
      );

    });

  }

  if(action === "stop"){

    video.pause();
    video.currentTime = 0;

  }
},


  copy:function(text){

    if(navigator.clipboard){

      navigator.clipboard.writeText(text);

    }
  }
};

</script>
