<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temeria Creator Studio</title>

<style>
*{box-sizing:border-box;}

body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(circle at top,#1b1f3a,#070a12 60%,#020617);
  color:white;
  font-family:Arial,sans-serif;
  padding:20px;
}

h1{
  text-align:center;
  color:#d8b4fe;
  text-shadow:0 0 25px #b06cff;
}

.topbar{
  max-width:1100px;
  margin:0 auto 20px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.14);
  border-radius:22px;
  padding:16px;
  box-shadow:0 0 35px rgba(176,108,255,.18);
}

input,select,button{
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:14px;
  border:none;
  font-size:15px;
}

button{
  cursor:pointer;
  font-weight:bold;
  background:linear-gradient(90deg,#00f6ff,#b06cff);
  color:white;
  box-shadow:0 0 20px rgba(176,108,255,.25);
}

.grid{
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  gap:12px;
}

.stageWrap{
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:70vh;
}

.stage{
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 20% 10%,rgba(176,108,255,.35),transparent 35%),
    radial-gradient(circle at 80% 90%,rgba(0,246,255,.25),transparent 35%),
    linear-gradient(180deg,#050816,#0f172a);
  border:1px solid rgba(255,255,255,.16);
  box-shadow:
    0 0 40px rgba(0,246,255,.18),
    0 0 80px rgba(176,108,255,.18);
}

.stage iframe{
  position:absolute;
  left:50%;
  top:0;
  border:0;
  background:transparent;
  transform-origin:top center;
}

.mode-tiktok{
  width:360px;
  height:640px;
  border-radius:26px;
}

.mode-youtube{
  width:900px;
  height:506px;
  border-radius:24px;
}

.mode-square{
  width:600px;
  height:600px;
  border-radius:26px;
}

.mode-mobile{
  width:390px;
  height:844px;
  border-radius:28px;
}

.hint{
  opacity:.75;
  font-size:13px;
  line-height:1.5;
}

@media(max-width:900px){
  .grid{grid-template-columns:1fr;}
  .mode-youtube{width:95vw;height:53vw;}
  .mode-square{width:90vw;height:90vw;}
}
</style>
</head>

<body>

<h1>🎬 Temeria Creator Studio</h1>

<div class="topbar">
  <div class="grid">
    <div>
      <label>Link card Temeria</label>
      <input id="cardUrl" placeholder="https://temeria.vercel.app/cards/..." />
    </div>

    <div>
      <label>Formato</label>
      <select id="mode">
        <option value="tiktok">TikTok / Reel / Shorts 9:16</option>
        <option value="youtube">YouTube 16:9</option>
        <option value="square">Square 1:1</option>
        <option value="mobile">Mobile Story</option>
      </select>
    </div>

    <div>
      <label>Zoom Card</label>
      <select id="zoomLevel">
        <option value="1">100%</option>
        <option value="0.9">90%</option>
        <option value="0.8" selected>80%</option>
        <option value="0.7">70%</option>
        <option value="0.6">60%</option>
      </select>
    </div>
  </div>

  <button onclick="loadCard()">✨ Carica Card</button>
  <button onclick="toggleFullscreen()">🖥️ Schermo pieno area</button>
  <button onclick="copyCreatorLink()">🔗 Copia link Creator</button>
  <button onclick="openOriginal()">🌐 Apri card originale</button>

  <div class="hint">
    Consiglio: scegli TikTok, prova Zoom 80% o 70%, poi registra solo la cornice.
  </div>
</div>

<div class="stageWrap">
  <div id="stage" class="stage mode-tiktok">
    <iframe id="cardFrame"></iframe>
  </div>
</div>

<script>
function getParam(name){
  return new URLSearchParams(window.location.search).get(name) || "";
}

function normalizeUrl(url){
  url = String(url || "").trim();

  if(!url) return "";

  if(url.startsWith("http://") || url.startsWith("https://")){
    return url;
  }

  return "https://temeria.vercel.app/" + url.replace(/^\/+/, "");
}

function applyZoom(){
  const frame = document.getElementById("cardFrame");
  const zoom = parseFloat(document.getElementById("zoomLevel").value || "0.8");

  frame.style.width = (100 / zoom) + "%";
  frame.style.height = (100 / zoom) + "%";
  frame.style.transform = `translateX(-50%) scale(${zoom})`;
}

function loadCard(){
  const input = document.getElementById("cardUrl");
  const frame = document.getElementById("cardFrame");
  const stage = document.getElementById("stage");
  const mode = document.getElementById("mode").value;

  const url = normalizeUrl(input.value);

  if(!url){
    alert("Inserisci il link della card.");
    return;
  }

  stage.className = "stage mode-" + mode;
  frame.onload = applyZoom;
  frame.src = url;

  setTimeout(applyZoom, 300);
}

function toggleFullscreen(){
  const stage = document.getElementById("stage");

  if(!document.fullscreenElement){
    stage.requestFullscreen?.();
  }else{
    document.exitFullscreen?.();
  }
}

function copyCreatorLink(){
  const url = normalizeUrl(document.getElementById("cardUrl").value);
  const mode = document.getElementById("mode").value;
  const zoom = document.getElementById("zoomLevel").value;

  if(!url){
    alert("Prima inserisci il link della card.");
    return;
  }

  const finalUrl =
    location.origin +
    location.pathname +
    "?mode=" + encodeURIComponent(mode) +
    "&zoom=" + encodeURIComponent(zoom) +
    "&url=" + encodeURIComponent(url);

  navigator.clipboard.writeText(finalUrl);
  alert("Link Creator copiato!");
}

function openOriginal(){
  const url = normalizeUrl(document.getElementById("cardUrl").value);

  if(!url){
    alert("Prima inserisci il link della card.");
    return;
  }

  window.open(url,"_blank");
}

window.addEventListener("load", function(){
  const url = getParam("url") || getParam("card");
  const mode = getParam("mode");
  const zoom = getParam("zoom");

  if(mode){
    document.getElementById("mode").value = mode;
  }

  if(zoom){
    document.getElementById("zoomLevel").value = zoom;
  }

  document.getElementById("zoomLevel").addEventListener("change", applyZoom);
  document.getElementById("mode").addEventListener("change", loadCard);

  if(url){
    document.getElementById("cardUrl").value = normalizeUrl(url);
    loadCard();
  }
});
</script>

</body>
</html>
